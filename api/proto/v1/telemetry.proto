syntax = "proto3";

package aegis.v1;

option go_package = "github.com/twojanazwa/aegis-edge/api/proto/v1;v1";

// Serwis obsługujący dwukierunkową komunikację między urządzeniem a chmurą
service AegisService {
  rpc Connect(stream DeviceMessage) returns (stream CloudCommand);
}

message DeviceMessage {
  string device_id = 1;
  int64 timestamp = 2;
  
  oneof payload {
    TelemetryData telemetry = 3;
    AlertEvent alert = 4;
  }
}

message TelemetryData {
  double cpu_usage_percent = 1;
  uint64 memory_free_bytes = 2;
  float temperature_celsius = 3;
  uint64 uptime_seconds = 4;
}

message AlertEvent {
  string event_type = 1;
  string description = 2;
}

message CloudCommand {
  string command_id = 1;
  string action = 2;
  map<string, string> parameters = 3;
}
